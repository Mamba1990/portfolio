# GitLab Pages deployment: the job must be named "pages"
pages:
  stage: deploy
  script:
    # Copy the site into the "public" folder served by GitLab Pages
    - mkdir -p public
    - cp index.html public/
    - cp -r media public/
  artifacts:
    paths:
      - public
  rules:
    # Deploy only when pushing to the default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH